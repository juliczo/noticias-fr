name: Actualizar noticias (FR)

on:
  # El ritmo lo marca el Worker de Cloudflare (workflow_dispatch cada ~15 min,
  # que sí es puntual). Este schedule queda solo como respaldo por si el Worker
  # está caído: una vez por hora.
  schedule:
    - cron: "27 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scraper/**"
      - ".github/workflows/**"
      - "docs/clave.js"

permissions:
  contents: write

concurrency:
  group: actualizar-noticias-fr
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Instalar dependencias
        working-directory: scraper
        run: pip install -r requirements.txt

      - name: Generar noticias
        working-directory: scraper
        run: python -m monitoreo.build

      - name: Publicar cambios y avisar
        env:
          PUSH_WORKER_URL: ${{ secrets.PUSH_WORKER_URL }}
          PUSH_EMIT_KEY: ${{ secrets.PUSH_EMIT_KEY }}
        run: |
          git config user.name "monitoreo-fr-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -m "noticias: $(date -u +%FT%TZ)"
          git push

          NUEVAS=$(python -c "import json; print(json.load(open('docs/data/estado.json')).get('nuevas_ultima_corrida', 0))" 2>/dev/null || echo 0)
          IDS=$(python -c "import json; print(json.dumps(json.load(open('docs/data/estado.json')).get('ids_nuevos', [])))" 2>/dev/null || echo "[]")
          echo "Notas nuevas en esta corrida: $NUEVAS"
          if [ "${NUEVAS:-0}" -gt 0 ] && [ -n "$PUSH_WORKER_URL" ] && [ -n "$PUSH_EMIT_KEY" ]; then
            curl -fsS -X POST "${PUSH_WORKER_URL%/}/emitir" \
              -H "X-Clave: $PUSH_EMIT_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"cantidad\": $NUEVAS, \"ids\": $IDS}" \
              && echo "Push emitido." \
              || echo "Aviso: el push no respondió (no es crítico, el cron reintenta)."
          fi
